  sql_queries:
    - - main
      - xorq_datafusion
      - |-
        SELECT
          "t6"."IDpol",
          "t6"."ClaimNb",
          LEAST("t6"."Exposure", 1.0) AS "Exposure",
          "t6"."Area",
          "t6"."VehPower",
          "t6"."VehAge",
          "t6"."DrivAge",
          "t6"."BonusMalus",
          "t6"."VehBrand",
          "t6"."VehGas",
          "t6"."Density",
          "t6"."Region",
          LEAST(COALESCE("t6"."ClaimAmount", 0.0), 200000.0) AS "ClaimAmount",
          CAST(LEAST(COALESCE("t6"."ClaimAmount", 0.0), 200000.0) AS DOUBLE PRECISION) / LEAST("t6"."Exposure", 1.0) AS "PurePremium",
          CAST(LEAST(COALESCE("t6"."ClaimAmount", 0.0), 200000.0) > 0 AS BIGINT) AS "has_claim"
        FROM (
          SELECT
            "t5"."IDpol",
            "t5"."ClaimNb",
            "t5"."Exposure",
            "t5"."Area",
            "t5"."VehPower",
            "t5"."VehAge",
            "t5"."DrivAge",
            "t5"."BonusMalus",
            "t5"."VehBrand",
            "t5"."VehGas",
            "t5"."Density",
            "t5"."Region",
            "t5"."ClaimAmount"
          FROM (
            SELECT
              "t2"."IDpol",
              "t2"."ClaimNb",
              "t2"."Exposure",
              "t2"."Area",
              "t2"."VehPower",
              "t2"."VehAge",
              "t2"."DrivAge",
              "t2"."BonusMalus",
              "t2"."VehBrand",
              "t2"."VehGas",
              "t2"."Density",
              "t2"."Region",
              "t4"."IDpol" AS "IDpol_right",
              "t4"."ClaimAmount"
            FROM "openml_41214" AS "t2"
            LEFT OUTER JOIN (
              SELECT
                "t1"."IDpol",
                SUM("t1"."ClaimAmount") AS "ClaimAmount"
              FROM (
                SELECT
                  "t1"."ClaimAmount",
                  "t1"."IDpol"
                FROM "openml_41215" AS "t1"
              ) AS t1
              GROUP BY
                "t1"."IDpol"
            ) AS "t4"
              ON "t2"."IDpol" = "t4"."IDpol"
          ) AS "t5"
        ) AS "t6"
    - - openml_41214
      - xorq_datafusion
      - |-
        SELECT
          *
        FROM "openml_41214"
    - - openml_41215
      - xorq_datafusion
      - |-
        SELECT
          *
        FROM "openml_41215"
