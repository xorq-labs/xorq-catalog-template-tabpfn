                  "t0"."DrivAge",
                  "t0"."VehBrand",
                  "t0"."VehPower",
                  "t0"."VehGas",
                  "t0"."Region",
                  "t0"."Area",
                  "t0"."BonusMalus",
                  "t0"."Density",
                  1.0
                ),
                1 + CAST(1 >= 0 AS SMALLINT)
              ) AS "p_claim",
              _PREDICT_SEVERITY_8B67E3B1EAF3(
                "t0"."VehAge",
                "t0"."DrivAge",
                "t0"."VehBrand",
                "t0"."VehPower",
                "t0"."VehGas",
                "t0"."Region",
                "t0"."Area",
                "t0"."BonusMalus",
                "t0"."Density",
                1.0
