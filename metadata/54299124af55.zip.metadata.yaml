            "t1"."has_claim",
            "t1"."observed_exposure",
            "t1"."p_claim",
            "t1"."severity",
            "t1"."p_claim" * "t1"."severity" AS "premium"
          FROM (
            SELECT
              "t0"."IDpol",
              "t0"."ClaimNb",
              1.0 AS "Exposure",
              "t0"."Area",
              "t0"."VehPower",
              "t0"."VehAge",
