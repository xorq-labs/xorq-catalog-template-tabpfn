              "t0"."ClaimAmount",
              "t0"."PurePremium",
              "t0"."has_claim",
              "t0"."Exposure" AS "observed_exposure",
              ARRAY_ELEMENT(
                _PREDICT_PROBA_CLAIM_AA4C9F40E438(
